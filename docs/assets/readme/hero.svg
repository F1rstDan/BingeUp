      <rect x="112" y="-12" width="64" height="26" rx="13" fill="#F8EFC9"/>
      <path d="M141 0h6M144-3v6" stroke="#DBA90E" stroke-width="3" stroke-linecap="round"/>
      <text x="144" y="45" text-anchor="middle" fill="#794F27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="800">upgrade</text>
      <text x="144" y="70" text-anchor="middle" fill="#9F927D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">/ˈʌpɡreɪd/</text>

      <g transform="translate(20 89)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">
        <rect width="248" height="42" rx="11" fill="#E6F9F6" stroke="#19C8B9"/>
        <rect x="10" y="8" width="26" height="26" rx="8" fill="#19C8B9"/>
        <text x="23" y="27" text-anchor="middle" fill="#F8F8F0">A</text>
        <text x="48" y="27" fill="#794F27">升级；改善</text>
        <rect y="50" width="248" height="42" rx="11" fill="#F0E8D8"/>
        <rect x="10" y="58" width="26" height="26" rx="8" fill="#DCD8D1"/>
        <text x="23" y="77" text-anchor="middle" fill="#9F927D">B</text>
        <text x="48" y="77" fill="#9F927D">暂停；延后</text>
