    <text x="2" y="144" fill="#50B9AB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="750" letter-spacing="5">BINGEUP</text>

    <text x="0" y="204" fill="#794F27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650">刷视频时，顺手学一个词。</text>
    <text x="0" y="243" fill="#9F927D" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">暂停片刻 · 轻量答题 · 继续播放</text>

    <g transform="translate(0 274)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">
      <rect width="112" height="38" rx="19" fill="#F8F8F0" stroke="#DCD8D1"/>
      <circle cx="20" cy="19" r="7" fill="#19C8B9"/>
      <text x="35" y="25" fill="#794F27">Bilibili</text>
      <rect x="124" width="118" height="38" rx="19" fill="#F8F8F0" stroke="#DCD8D1"/>
      <circle cx="144" cy="19" r="7" fill="#F5C31C"/>
      <text x="159" y="25" fill="#794F27">YouTube</text>
      <rect x="254" width="110" height="38" rx="19" fill="#F8F8F0" stroke="#DCD8D1"/>
      <circle cx="274" cy="19" r="7" fill="#6FBA2C"/>
      <text x="289" y="25" fill="#794F27">FSRS</text>
    </g>
  </g>

  <g id="product-proof">
