      <circle cx="1085" cy="100" r="118" fill="#6B5A44"/>
      <path d="M760 270C840 206 903 238 970 178s120-57 186-88v272H744z" fill="#4A3B2E"/>
      <path d="M768 326h348" stroke="#8A7A66" stroke-width="6" stroke-linecap="round"/>
      <path d="M768 326h182" stroke="#19C8B9" stroke-width="6" stroke-linecap="round"/>
      <circle cx="950" cy="326" r="9" fill="#F8F8F0" stroke="#19C8B9" stroke-width="5"/>
    </g>

